<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>RoutePilot</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
    background:#f5f5f7;
    color:#111;
}

.app{
    max-width:520px;
    margin:auto;
    min-height:100vh;
    padding-bottom:100px;
}

.header{
    background:#111;
    color:white;
    padding:28px 20px 22px;
    border-radius:0 0 24px 24px;
}

.logo{
    font-size:28px;
    font-weight:800;
}

.subtitle{
    margin-top:5px;
    opacity:.7;
    font-size:14px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:16px;
}

.stat{
    background:white;
    border-radius:16px;
    padding:14px;
}

.stat-number{
    font-size:22px;
    font-weight:800;
}

.stat-label{
    color:#777;
    font-size:11px;
    margin-top:4px;
}

.section{
    padding:0 16px 16px;
}

.section-title{
    font-size:19px;
    font-weight:800;
    margin:10px 0;
}

.buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:13px;
    padding:12px 15px;
    font-weight:700;
    font-size:14px;
}

.primary{
    background:#111;
    color:white;
}

.secondary{
    background:white;
    color:#111;
}

.map{
    height:190px;
    margin:0 16px 20px;
    border-radius:20px;
    background:#dce8d7;
    position:relative;
    overflow:hidden;
}

.road1{
    position:absolute;
    width:130%;
    height:10px;
    background:white;
    transform:rotate(25deg);
    top:80px;
    left:-15%;
}

.road2{
    position:absolute;
    width:130%;
    height:8px;
    background:white;
    transform:rotate(-20deg);
    top:115px;
    left:-10%;
}

.route{
    position:absolute;
    width:75%;
    height:4px;
    background:#111;
    transform:rotate(-12deg);
    top:98px;
    left:13%;
}

.pin{
    position:absolute;
    width:22px;
    height:22px;
    background:#111;
    border-radius:50%;
    border:5px solid white;
}

.pin1{left:18%;top:120px}
.pin2{left:40%;top:85px}
.pin3{left:64%;top:60px}
.pin4{left:80%;top:125px}

.delivery{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:10px;
}

.delivery-top{
    display:flex;
    gap:12px;
}

.number{
    width:32px;
    height:32px;
    background:#eee;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.customer{
    font-weight:800;
}

.address{
    color:#666;
    font-size:13px;
    margin-top:3px;
}

.package{
    color:#999;
    font-size:12px;
    margin-top:6px;
}

.delivery-buttons{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.delivery-buttons button{
    flex:1;
}

.done{
    opacity:.55;
}

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:78px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
    max-width:520px;
    margin:auto;
}

.nav{
    text-align:center;
    color:#777;
    font-size:11px;
}

.nav-icon{
    font-size:22px;
    color:#111;
    display:block;
    margin-bottom:3px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:flex-end;
    z-index:10;
}

.modal-box{
    width:100%;
    max-width:520px;
    margin:auto;
    background:white;
    border-radius:25px 25px 0 0;
    padding:22px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    margin:6px 0;
    font-size:15px;
}

.modal button{
    width:100%;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <div class="logo">RoutePilot</div>
    <div class="subtitle">Planifică. Livrează. Termină mai repede.</div>
</div>

<div class="stats">

<div class="stat">
    <div class="stat-number" id="total">5</div>
    <div class="stat-label">LIVRĂRI</div>
</div>

<div class="stat">
    <div class="stat-number" id="completed">1</div>
    <div class="stat-label">FINALIZATE</div>
</div>

<div class="stat">
    <div class="stat-number">34.8</div>
    <div class="stat-label">KM ESTIMAȚI</div>
</div>

</div>

<div class="section">

<div class="buttons">

<button class="primary" onclick="optimizeRoute()">
    Optimizează ruta
</button>

<button class="secondary" onclick="openModal()">
    + Adaugă
</button>

</div>

</div>

<div class="map">

<div class="road1"></div>
<div class="road2"></div>
<div class="route"></div>

<div class="pin pin1"></div>
<div class="pin pin2"></div>
<div class="pin pin3"></div>
<div class="pin pin4"></div>

</div>

<div class="section">

<div class="section-title">
    Opriri
</div>

<div id="deliveries"></div>

</div>

</div>

<div class="bottom">

<div class="nav">
<span class="nav-icon">⌂</span>
Rută
</div>

<div class="nav" onclick="openModal()">
<span class="nav-icon">＋</span>
Adaugă
</div>

<div class="nav">
<span class="nav-icon">✓</span>
Istoric
</div>

<div class="nav">
<span class="nav-icon">⚙</span>
Setări
</div>

</div>

<div class="modal" id="modal">

<div class="modal-box">

<h2>Adaugă livrare</h2>

<input id="name" placeholder="Nume client">

<input id="address" placeholder="Adresă">

<input id="phone" placeholder="Telefon">

<button class="primary" onclick="addDelivery()">
    Salvează livrarea
</button>

<button class="secondary" onclick="closeModal()">
    Anulează
</button>

</div>

</div>

<script>

let deliveries = [

{
name:"Ion Popescu",
address:"Hauptstraße 18, München",
package:"Pachet #RP-1042",
done:false
},

{
name:"Andrei Ionescu",
address:"Freisinger Straße 44, Eching",
package:"Pachet #RP-1043",
done:false
},

{
name:"Maria Müller",
address:"Dorfstraße 7, Garching",
package:"Pachet #RP-1044",
done:false
},

{
name:"Daniel Weber",
address:"Bahnhofstraße 21, Unterschleißheim",
package:"Pachet #RP-1045",
done:true
},

{
name:"Elena Stoica",
address:"Lindenweg 12, Oberschleißheim",
package:"Pachet #RP-1046",
done:false
}

];

function render(){

const container=document.getElementById("deliveries");

container.innerHTML="";

deliveries.forEach((delivery,index)=>{

const div=document.createElement("div");

div.className="delivery "+(delivery.done?"done":"");

div.innerHTML=`

<div class="delivery-top">

<div class="number">
${index+1}
</div>

<div>

<div class="customer">
${delivery.name}
</div>

<div class="address">
${delivery.address}
</div>

<div class="package">
${delivery.package}
</div>

</div>

</div>

<div class="delivery-buttons">

<button class="secondary"
onclick="navigate('${delivery.address}')">
Navighează
</button>

<button class="${delivery.done?'secondary':'primary'}"
onclick="completeDelivery(${index})">

${delivery.done?'Finalizat':'Marchează livrat'}

</button>

</div>

`;

container.appendChild(div);

});

updateStats();

}

function updateStats(){

document.getElementById("total").innerText=deliveries.length;

document.getElementById("completed").innerText=
deliveries.filter(x=>x.done).length;

}

function completeDelivery(index){

deliveries[index].done=true;

render();

}

function navigate(address){

const url=
"https://maps.apple.com/?address="+
encodeURIComponent(address);

window.location.href=url;

}

function optimizeRoute(){

deliveries.sort((a,b)=>{

return Number(a.done)-Number(b.done);

});

render();

alert("Ruta a fost reorganizată. Opririle finalizate au fost mutate la final.");

}

function openModal(){

document.getElementById("modal").style.display="flex";

}

function closeModal(){

document.getElementById("modal").style.display="none";

}

function addDelivery(){

const name=
document.getElementById("name").value ||
"Client nou";

const address=
document.getElementById("address").value ||
"Adresă nouă";

const phone=
document.getElementById("phone").value;

deliveries.push({

name:name,

address:address,

package:phone?
"Pachet • "+phone:
"Pachet nou",

done:false

});

document.getElementById("name").value="";
document.getElementById("address").value="";
document.getElementById("phone").value="";

closeModal();

render();

}

render();

</script>

</body>
</html>
