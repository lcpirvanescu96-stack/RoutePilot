<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">

<title>RoutePilot</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
  background:#f5f5f7;
  color:#111;
}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  padding-bottom:100px;
}

.header{
  background:#111;
  color:white;
  padding:28px 20px 22px;
  border-radius:0 0 24px 24px;
}

.logo{
  font-size:28px;
  font-weight:800;
}

.subtitle{
  margin-top:5px;
  opacity:.7;
  font-size:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:16px;
}

.stat{
  background:white;
  border-radius:16px;
  padding:14px;
}

.stat-number{
  font-size:22px;
  font-weight:800;
}

.stat-label{
  color:#777;
  font-size:11px;
  margin-top:4px;
}

.section{
  padding:0 16px 16px;
}

.buttons{
  display:flex;
  gap:8px;
}

button{
  border:0;
  border-radius:13px;
  padding:12px 15px;
  font-weight:700;
  font-size:14px;
}

.primary{
  background:#111;
  color:white;
}

.secondary{
  background:white;
  color:#111;
}

#map{
  height:360px;
  margin:0 16px 20px;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.section-title{
  font-size:19px;
  font-weight:800;
  margin:10px 0;
}

.delivery{
  background:white;
  border-radius:18px;
  padding:15px;
  margin-bottom:10px;
}

.delivery-top{
  display:flex;
  gap:12px;
}

.number{
  width:34px;
  height:34px;
  background:#111;
  color:white;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  flex-shrink:0;
}

.customer{
  font-weight:800;
}

.address{
  color:#666;
  font-size:13px;
  margin-top:3px;
}

.package{
  color:#999;
  font-size:12px;
  margin-top:6px;
}

.delivery-buttons{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.delivery-buttons button{
  flex:1;
}

.done{
  opacity:.5;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:78px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  max-width:600px;
  margin:auto;
  z-index:999;
}

.nav{
  text-align:center;
  color:#777;
  font-size:11px;
}

.nav-icon{
  font-size:22px;
  color:#111;
  display:block;
  margin-bottom:3px;
}

.leaflet-popup-content{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

.popup-title{
  font-weight:800;
  font-size:16px;
}

.popup-address{
  color:#666;
  margin-top:4px;
}

.popup-button{
  display:inline-block;
  margin-top:10px;
  padding:8px 12px;
  background:#111;
  color:white;
  border-radius:9px;
  text-decoration:none;
  font-weight:700;
}

.custom-pin{
  width:34px;
  height:34px;
  background:#111;
  color:white;
  border:3px solid white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  box-shadow:0 3px 10px rgba(0,0,0,.35);
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  align-items:flex-end;
  z-index:2000;
}

.modal-box{
  width:100%;
  max-width:600px;
  margin:auto;
  background:white;
  border-radius:25px 25px 0 0;
  padding:22px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  margin:6px 0;
  font-size:15px;
}

.modal button{
  width:100%;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <div class="logo">RoutePilot</div>
  <div class="subtitle">
    Planifică. Livrează. Termină mai repede.
  </div>
</div>

<div class="stats">

  <div class="stat">
    <div class="stat-number" id="total">5</div>
    <div class="stat-label">LIVRĂRI</div>
  </div>

  <div class="stat">
    <div class="stat-number" id="completed">1</div>
    <div class="stat-label">FINALIZATE</div>
  </div>

  <div class="stat">
    <div class="stat-number">34.8</div>
    <div class="stat-label">KM ESTIMAȚI</div>
  </div>

</div>

<div class="section">

  <div class="buttons">

    <button class="primary" onclick="optimizeRoute()">
      Optimizează ruta
    </button>

    <button class="secondary" onclick="openModal()">
      + Adaugă
    </button>

  </div>

</div>

<div id="map"></div>

<div class="section">

  <div class="section-title">
    Opriri
  </div>

  <div id="deliveries"></div>

</div>

</div>

<div class="bottom">

  <div class="nav">
    <span class="nav-icon">⌂</span>
    Rută
  </div>

  <div class="nav" onclick="openModal()">
    <span class="nav-icon">＋</span>
    Adaugă
  </div>

  <div class="nav">
    <span class="nav-icon">✓</span>
    Istoric
  </div>

  <div class="nav">
    <span class="nav-icon">⚙</span>
    Setări
  </div>

</div>

<div class="modal" id="modal">

  <div class="modal-box">

    <h2>Adaugă livrare</h2>

    <input id="name" placeholder="Nume client">

    <input id="address" placeholder="Adresă">

    <input id="phone" placeholder="Telefon">

    <button class="primary" onclick="addDelivery()">
      Salvează livrarea
    </button>

    <button class="secondary" onclick="closeModal()">
      Anulează
    </button>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let deliveries = [

  {
    name:"Ion Popescu",
    address:"Hauptstraße 18, München",
    package:"Pachet #RP-1042",
    lat:48.137,
    lng:11.575,
    done:false
  },

  {
    name:"Andrei Ionescu",
    address:"Freisinger Straße 44, Eching",
    package:"Pachet #RP-1043",
    lat:48.299,
    lng:11.615,
    done:false
  },

  {
    name:"Maria Müller",
    address:"Dorfstraße 7, Garching",
    package:"Pachet #RP-1044",
    lat:48.248,
    lng:11.650,
    done:false
  },

  {
    name:"Daniel Weber",
    address:"Bahnhofstraße 21, Unterschleißheim",
    package:"Pachet #RP-1045",
    lat:48.280,
    lng:11.570,
    done:true
  },

  {
    name:"Elena Stoica",
    address:"Lindenweg 12, Oberschleißheim",
    package:"Pachet #RP-1046",
    lat:48.255,
    lng:11.555,
    done:false
  }

];


/* HARTA */

const map = L.map("map");

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:"© OpenStreetMap contributors"
  }
).addTo(map);

let markers = [];
let routeLine = null;


/* PIN PERSONALIZAT */

function createNumberIcon(number){

  return L.divIcon({

    className:"",

    html:`
      <div class="custom-pin">
        ${number}
      </div>
    `,

    iconSize:[34,34],

    iconAnchor:[17,17],

    popupAnchor:[0,-18]

  });

}


/* DESENEAZĂ HARTA */

function renderMap(){

  markers.forEach(marker => map.removeLayer(marker));

  markers=[];

  if(routeLine){
    map.removeLayer(routeLine);
    routeLine=null;
  }

  const points=[];

  deliveries.forEach((delivery,index)=>{

    const marker = L.marker(
      [delivery.lat,delivery.lng],
      {
        icon:createNumberIcon(index+1)
      }
    ).addTo(map);

    marker.bindPopup(`

      <div class="popup-title">
        ${index+1}. ${delivery.name}
      </div>

      <div class="popup-address">
        ${delivery.address}
      </div>

      <a
        class="popup-button"
        href="https://maps.apple.com/?address=${encodeURIComponent(delivery.address)}"
      >
        Navighează
      </a>

    `);

    markers.push(marker);

    points.push([
      delivery.lat,
      delivery.lng
    ]);

  });


  if(points.length > 1){

    routeLine = L.polyline(
      points,
      {
        weight:5,
        opacity:.8
      }
    ).addTo(map);

  }


  if(points.length){

    map.fitBounds(points,{
      padding:[30,30]
    });

  }

}


/* LISTA */

function render(){

  const container =
    document.getElementById("deliveries");

  container.innerHTML="";

  deliveries.forEach((delivery,index)=>{

    const div =
      document.createElement("div");

    div.className =
      "delivery " +
      (delivery.done ? "done" : "");

    div.innerHTML=`

      <div class="delivery-top">

        <div class="number">
          ${index+1}
        </div>

        <div>

          <div class="customer">
            ${delivery.name}
          </div>

          <div class="address">
            ${delivery.address}
          </div>

          <div class="package">
            ${delivery.package}
          </div>

        </div>

      </div>

      <div class="delivery-buttons">

        <button
          class="secondary"
          onclick="navigate('${delivery.address}')"
        >
          Navighează
        </button>

        <button
          class="${delivery.done ? "secondary" : "primary"}"
          onclick="completeDelivery(${index})"
        >
          ${delivery.done ? "Finalizat" : "Marchează livrat"}
        </button>

      </div>

    `;

    container.appendChild(div);

  });

  updateStats();

  renderMap();

}


function updateStats(){

  document.getElementById("total").innerText =
    deliveries.length;

  document.getElementById("completed").innerText =
    deliveries.filter(x => x.done).length;

}


function completeDelivery(index){

  deliveries[index].done=true;

  render();

}


function navigate(address){

  window.location.href =
    "https://maps.apple.com/?address=" +
    encodeURIComponent(address);

}


/* OPTIMIZARE DEMO */

function optimizeRoute(){

  deliveries.sort(
    (a,b) =>
      Number(a.done)-Number(b.done)
  );

  render();

  alert(
    "Ruta a fost reorganizată."
  );

}


/* MODAL */

function openModal(){

  document.getElementById("modal")
    .style.display="flex";

}


function closeModal(){

  document.getElementById("modal")
    .style.display="none";

}


/* ADAUGĂ */

function addDelivery(){

  const name =
    document.getElementById("name").value ||
    "Client nou";

  const address =
    document.getElementById("address").value ||
    "Adresă nouă";

  const phone =
    document.getElementById("phone").value;


  /*
    Pentru moment folosim coordonate
    de test. În următoarea versiune
    vom transforma automat adresa
    în coordonate GPS.
  */

  deliveries.push({

    name:name,

    address:address,

    package:
      phone
      ? "Pachet • "+phone
      : "Pachet nou",

    lat:48.137,

    lng:11.575,

    done:false

  });


  document.getElementById("name").value="";
  document.getElementById("address").value="";
  document.getElementById("phone").value="";

  closeModal();

  render();

}


/* PORNIRE */

render();

</script>

</body>
</html>
